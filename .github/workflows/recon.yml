name: recon
on: {push: {paths: ["trial/**", "recon/**", ".github/workflows/recon.yml"]}, workflow_dispatch: {}}
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install curl_cffi pytest
      - run: python recon/t.py
      - run: cd trial && python -m pytest -q && python run_pipeline.py
      - run: |
          cd trial && python - <<'PY'
          import json, collections
          d = json.load(open("docs/toledo_code_enforcement.json")); L = d["leads"]
          print("@@meta@@", json.dumps(d["meta"]))
          print("@@owner@@", collections.Counter(r["owner_class"] for r in L), "matched", sum(1 for r in L if r["parcel"]))
          print("@@scores@@", sorted(collections.Counter(r["score"] // 10 * 10 for r in L).items()))
          print("@@types@@", collections.Counter(t for r in L for t in r["lead_types"]).most_common())
          for r in L[:6]: print("@@top@@", r["score"], r["property_address"], r["owner_name"], r["mailing_address"], r["lead_types"], r["notes"])
          un = [r for r in L if not r["parcel"]][:8]
          for r in un: print("@@unmatched@@", r["property_address"], r["zip"])
          PY
