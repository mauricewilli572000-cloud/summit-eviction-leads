name: recon
on: {push: {paths: ["recon/**", ".github/workflows/recon.yml"]}, workflow_dispatch: {}}
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install curl_cffi openpyxl && sudo apt-get install -y -qq mdbtools >/dev/null
      - run: python recon/recon.py
